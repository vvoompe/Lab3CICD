name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "ivan-workflow" ]
  pull_request:
    branches: [ "main", "master" ]

# КРИТИЧНО: Надаємо права на запис для автоматичного злиття гілок
permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Завантаження коду з репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Збірка та запуск Docker контейнерів
        run: docker compose up -d --build

      - name: Запуск модульних тестів Django
        run: docker compose exec -T web python manage.py test

      - name: Зупинка контейнерів
        if: always()
        run: docker compose down


  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: build
    # Деплой запускається тільки якщо тести пройшли успішно І код знаходиться в головній гілці
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: true # Використовуємо Docker, оскільки у нас є Dockerfile

  merge-to-master:
    name: Auto Merge to Master
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/ivan-workflow' && github.event_name == 'push'
    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Завантажуємо всю історію для коректного мержу

      - name: Merge ivan-workflow into main
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: ivan-workflow
          target_branch: main
          github_token: ${{ github.token }}